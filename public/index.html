<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f4f7f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101b25" media="(prefers-color-scheme: dark)">
  <title>Hielo LOLHA</title>
  <link rel="stylesheet" href="/css/estilo.css">
  <link rel="icon" href="/icono.png">
  <link rel="apple-touch-icon" href="/icono.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LOLHA">
</head>
<body>

  <header id="barra" hidden>
    <div class="barra-interior">
      <div class="barra-izq">
        <button id="btn-atras" class="icono" title="Atrás" hidden>‹</button>
        <span class="reloj">
          <span id="reloj-fecha" class="reloj-fecha"></span>
          <span id="reloj-hora" class="reloj-hora">—</span>
        </span>
      </div>

      <div id="barra-marca" class="barra-marca"></div>

      <div class="barra-der">
        <span class="barra-usuario">
          <strong id="barra-nombre">—</strong>
          <small id="barra-rol">—</small>
        </span>
        <button id="btn-menu" class="icono" title="Menú">☰</button>
      </div>
    </div>
  </header>

  <nav id="menu" hidden>
    <div class="menu-fondo"></div>
    <div class="menu-panel">
      <div class="menu-usuario">
        <span id="menu-nombre">—</span>
        <small id="menu-rol">—</small>
      </div>
      <a href="#/inicio"><span class="menu-icono">🏠</span>Inicio</a>
      <a href="#/tanques" data-permiso="produccion.ver"><span class="menu-icono">🧊</span>Producción de hielo</a>
      <a href="#/venta" data-permiso="venta.registrar"><span class="menu-icono">🛒</span>Punto de venta</a>
      <a href="#/caja" data-permiso="caja.ver"><span class="menu-icono">💵</span>Caja</a>
      <a href="#/usuarios" data-permiso="usuarios.administrar"><span class="menu-icono">👥</span>Usuarios</a>
      <a href="#/raya" data-permiso="raya.ver"><span class="menu-icono">💵</span>La raya</a>
      <a href="#/productos" data-permiso="inventario.ver"><span class="menu-icono">🏷️</span>Productos y precios</a>
      <a href="#/clientes" data-permiso="clientes.ver"><span class="menu-icono">🤝</span>Clientes</a>
      <a href="#/historial" data-permiso="historial.ver"><span class="menu-icono">📋</span>Historial</a>
      <a href="#/empresa" data-permiso="empresa.ver"><span class="menu-icono">🏦</span>Cuentas de la empresa</a>
      <a href="#/estadisticas" data-permiso="estadisticas.ver"><span class="menu-icono">📊</span>Los números</a>
      <a href="#/personalizar" data-permiso="sistema.configurar"><span class="menu-icono">🎨</span>Personalizar</a>
      <a href="#/sistema" data-permiso="sistema.ver"><span class="menu-icono">⚙️</span>Sistema</a>
      <a href="#/ayuda"><span class="menu-icono">❓</span>Ayuda</a>
      <a href="#/novedades"><span class="menu-icono">✨</span>Qué hay de nuevo <span id="punto-novedades" class="punto" hidden></span></a>
      <div class="tema-selector">
        <p>Apariencia</p>
        <div class="tema-opciones" id="tema-opciones">
          <button data-tema="claro"  aria-pressed="false">☀️ Claro</button>
          <button data-tema="oscuro" aria-pressed="false">🌙 Oscuro</button>
          <button data-tema="auto"   aria-pressed="false">🔄 Auto</button>
        </div>
      </div>

      <button id="btn-salir" class="peligro" style="margin-top:14px">Cerrar sesión</button>
      <small class="version-menu">
        Hielo LOLHA · <span class="version">—</span><br>
        <span class="creditos">Desarrollado por CasTec</span>
      </small>
    </div>
  </nav>

  <main id="pantalla"><div class="cargando">Cargando…</div></main>

  <!--
    Lo único que sale por la impresora. Vive fuera de <main> a propósito:
    al imprimir se esconde todo lo demás, así el ticket sale solo aunque
    encima haya un diálogo o la pantalla de cobro.
  -->
  <div id="area-impresion" aria-hidden="true"></div>

  <div id="aviso" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
