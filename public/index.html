<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f4f7f" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101b25" media="(prefers-color-scheme: dark)">
  <title>Hielo LOLHA</title>
  <link rel="stylesheet" href="/css/estilo.css">
  <link rel="icon" href="/icono.png">
  <link rel="apple-touch-icon" href="/icono.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LOLHA">
</head>
<body>

  <header id="barra" hidden>
    <div class="barra-interior">
      <div class="barra-izq">
        <button id="btn-atras" class="icono" title="Atrás" hidden>‹</button>
        <span class="reloj">
          <span id="reloj-fecha" class="reloj-fecha"></span>
          <span id="reloj-hora" class="reloj-hora">—</span>
        </span>
      </div>

      <div id="barra-marca" class="barra-marca"></div>

      <div class="barra-der">
        <span class="barra-usuario">
          <strong id="barra-nombre">—</strong>
          <small id="barra-rol">—</small>
        </span>
        <button id="btn-menu" class="icono" title="Menú">☰</button>
      </div>
    </div>
  </header>

  <nav id="menu" hidden>
    <div class="menu-fondo"></div>
    <div class="menu-panel">
      <div class="menu-usuario">
        <span id="menu-nombre">—</span>
        <small id="menu-rol">—</small>
      </div>
      <a href="#/inicio">Inicio</a>
      <a href="#/tanques" data-permiso="produccion.ver">Producción</a>
      <a href="#/existencia" data-permiso="existencia.ver">Existencia</a>
      <a href="#/config-tanques" data-permiso="produccion.ver">Configurar tanques</a>
      <a href="#/usuarios" data-permiso="usuarios.administrar">Usuarios</a>
      <a href="#/personalizar" data-permiso="sistema.configurar">Personalizar</a>
      <a href="#/sistema" data-permiso="sistema.ver">Sistema</a>
      <a href="#/novedades">Qué hay de nuevo <span id="punto-novedades" class="punto" hidden></span></a>
      <div class="tema-selector">
        <p>Apariencia</p>
        <div class="tema-opciones" id="tema-opciones">
          <button data-tema="claro"  aria-pressed="false">☀️ Claro</button>
          <button data-tema="oscuro" aria-pressed="false">🌙 Oscuro</button>
          <button data-tema="auto"   aria-pressed="false">🔄 Auto</button>
        </div>
      </div>

      <button id="btn-salir" class="peligro" style="margin-top:14px">Cerrar sesión</button>
      <small class="version-menu">
        Hielo LOLHA · <span class="version">—</span><br>
        <span class="creditos">Desarrollado por CasTec</span>
      </small>
    </div>
  </nav>

  <main id="pantalla"><div class="cargando">Cargando…</div></main>

  <div id="aviso" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
